<!doctype html><meta charset="utf-8"><title>Kai poster render</title>
<style>body { margin: 0; } #kai { width:640px; height:640px; } canvas { width:100%; height:100%; }</style>
<div id="kai"></div>
<script type="module">
import { createKai } from '../assets/kai/runtime/scene.js';
// Serve this page at the repo root with a base URL so model paths match production.
const base = document.createElement('base'); base.href = '../'; document.head.append(base);
const scene = await createKai(document.querySelector('#kai'), { capture: true });
scene.render();
window.kaiPoster = scene.poster();
</script>
